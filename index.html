<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 할일</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 도시 배경 -->
    <svg class="city-background" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
        <defs>
            <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#1a1f3a;stop-opacity:1" />
            </linearGradient>
        </defs>
        <rect width="1200" height="800" fill="url(#skyGradient)" />

        <!-- 빌딩들 (왼쪽) -->
        <rect x="50" y="500" width="80" height="300" fill="#0d1929" opacity="0.7" />
        <rect x="60" y="520" width="12" height="15" fill="#2a5cdb" opacity="0.6" />
        <rect x="80" y="520" width="12" height="15" fill="#2a5cdb" opacity="0.6" />
        <rect x="100" y="520" width="12" height="15" fill="#2a5cdb" opacity="0.4" />
        <rect x="60" y="545" width="12" height="15" fill="#2a5cdb" opacity="0.5" />
        <rect x="80" y="545" width="12" height="15" fill="#2a5cdb" opacity="0.6" />
        <rect x="100" y="545" width="12" height="15" fill="#2a5cdb" opacity="0.4" />
        <rect x="60" y="570" width="12" height="15" fill="#2a5cdb" opacity="0.6" />
        <rect x="80" y="570" width="12" height="15" fill="#2a5cdb" opacity="0.5" />

        <!-- 빌딩들 (중앙-왼쪽) -->
        <rect x="200" y="480" width="90" height="320" fill="#0d1929" opacity="0.6" />
        <rect x="215" y="510" width="14" height="18" fill="#2a5cdb" opacity="0.7" />
        <rect x="240" y="510" width="14" height="18" fill="#2a5cdb" opacity="0.5" />
        <rect x="265" y="510" width="14" height="18" fill="#2a5cdb" opacity="0.6" />
        <rect x="215" y="545" width="14" height="18" fill="#2a5cdb" opacity="0.6" />
        <rect x="240" y="545" width="14" height="18" fill="#2a5cdb" opacity="0.7" />
        <rect x="265" y="545" width="14" height="18" fill="#2a5cdb" opacity="0.5" />

        <!-- 빌딩들 (중앙) -->
        <rect x="380" y="450" width="100" height="350" fill="#0a0f24" opacity="0.8" />
        <rect x="395" y="480" width="15" height="20" fill="#2a5cdb" opacity="0.6" />
        <rect x="425" y="480" width="15" height="20" fill="#2a5cdb" opacity="0.7" />
        <rect x="455" y="480" width="15" height="20" fill="#2a5cdb" opacity="0.5" />
        <rect x="395" y="520" width="15" height="20" fill="#2a5cdb" opacity="0.7" />
        <rect x="425" y="520" width="15" height="20" fill="#2a5cdb" opacity="0.6" />
        <rect x="455" y="520" width="15" height="20" fill="#2a5cdb" opacity="0.5" />
        <rect x="395" y="560" width="15" height="20" fill="#2a5cdb" opacity="0.5" />
        <rect x="425" y="560" width="15" height="20" fill="#2a5cdb" opacity="0.6" />
        <rect x="455" y="560" width="15" height="20" fill="#2a5cdb" opacity="0.7" />

        <!-- 빌딩들 (중앙-오른쪽) -->
        <rect x="560" y="490" width="85" height="310" fill="#0d1929" opacity="0.7" />
        <rect x="575" y="520" width="13" height="16" fill="#2a5cdb" opacity="0.5" />
        <rect x="600" y="520" width="13" height="16" fill="#2a5cdb" opacity="0.6" />
        <rect x="625" y="520" width="13" height="16" fill="#2a5cdb" opacity="0.7" />
        <rect x="575" y="550" width="13" height="16" fill="#2a5cdb" opacity="0.6" />
        <rect x="600" y="550" width="13" height="16" fill="#2a5cdb" opacity="0.5" />
        <rect x="625" y="550" width="13" height="16" fill="#2a5cdb" opacity="0.6" />

        <!-- 빌딩들 (오른쪽) -->
        <rect x="750" y="520" width="75" height="280" fill="#0d1929" opacity="0.6" />
        <rect x="765" y="545" width="11" height="14" fill="#2a5cdb" opacity="0.5" />
        <rect x="785" y="545" width="11" height="14" fill="#2a5cdb" opacity="0.6" />
        <rect x="805" y="545" width="11" height="14" fill="#2a5cdb" opacity="0.7" />
        <rect x="765" y="570" width="11" height="14" fill="#2a5cdb" opacity="0.6" />
        <rect x="785" y="570" width="11" height="14" fill="#2a5cdb" opacity="0.5" />
        <rect x="805" y="570" width="11" height="14" fill="#2a5cdb" opacity="0.6" />
    </svg>

    <div class="container">
        <!-- 헤더 -->
        <header class="header">
            <h1 class="app-title">오늘의 할일</h1>
            <p class="today-date" id="todayDate"></p>
        </header>

        <!-- 진행률 영역 -->
        <section class="progress-section">
            <div class="progress-bar-wrapper">
                <div class="progress-bar" id="progressBar" style="width: 0%"></div>
            </div>
            <div class="progress-stats">
                <span class="progress-text" id="progressText">할 일을 추가해 보세요</span>
            </div>
            <div class="category-progress">
                <div class="category-stat">
                    <span class="category-label work">업무</span>
                    <span class="category-count" id="workCount">0 / 0</span>
                </div>
                <div class="category-stat">
                    <span class="category-label personal">개인</span>
                    <span class="category-count" id="personalCount">0 / 0</span>
                </div>
                <div class="category-stat">
                    <span class="category-label study">공부</span>
                    <span class="category-count" id="studyCount">0 / 0</span>
                </div>
            </div>
        </section>

        <!-- 필터 탭 -->
        <nav class="filter-tabs">
            <button class="filter-tab active" data-filter="all">전체</button>
            <button class="filter-tab" data-filter="work">업무</button>
            <button class="filter-tab" data-filter="personal">개인</button>
            <button class="filter-tab" data-filter="study">공부</button>
        </nav>

        <!-- 입력 영역 -->
        <section class="input-section">
            <div class="input-wrapper">
                <input
                    type="text"
                    id="todoInput"
                    class="todo-input"
                    placeholder="할일을 입력하세요 (최대 100자)"
                    maxlength="100"
                >
                <div class="input-controls">
                    <select id="categorySelect" class="category-select">
                        <option value="work">업무</option>
                        <option value="personal">개인</option>
                        <option value="study">공부</option>
                    </select>
                    <button class="add-btn">추가</button>
                </div>
            </div>
        </section>

        <!-- 할일 목록 -->
        <section class="todo-list-section">
            <ul class="todo-list" id="todoList"></ul>
        </section>

        <!-- 하단 버튼 -->
        <footer class="footer">
            <button class="clear-completed-btn" aria-label="완료된 모든 항목 삭제">완료 항목 삭제</button>
        </footer>
    </div>

    <!-- 토스트 메시지 (삭제 안내/복구) -->
    <div class="toast" id="toast">
        <span id="toastMessage"></span>
    </div>

    <script src="app.js"></script>
</body>
</html>
